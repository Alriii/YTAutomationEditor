name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android 35 SDK
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable sideload signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: continuity-studio-android-signing-v1

      - name: Ensure signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Continuity Studio Android,O=Continuity Studio,C=PH"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
          cache-provider: basic

      - name: Build installable APK
        run: gradle -p android-client :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android-client/app/build/outputs/apk/debug/app-debug.apk"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 "$APK"

      - name: Name APK
        run: cp android-client/app/build/outputs/apk/debug/app-debug.apk Continuity-Studio-S23-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Continuity-Studio-S23-v3
          path: Continuity-Studio-S23-v3.apk
          if-no-files-found: error
          retention-days: 30
