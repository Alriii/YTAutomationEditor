plugins {
    id "com.android.application"
}

android {
    namespace "com.continuitystudio.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.continuitystudio.android"
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName "3.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7"
}
